version: "3.8"

# swain-helm production Docker Compose
# --------------------------------------
# Run the watchdog with project bridges in Docker.
#
# Quick start:
#   PROJECT_PATH=/path/to/project docker compose up -d
#
# With 1Password credentials (recommended):
#   op run --env-file=.env -- docker compose up -d
#
# Required environment:
#   PROJECT_PATH - Path to project on host
#   PROJECT_NAME - Name of project (for stream)
#   ZULIP_BOT_EMAIL - Bot email
#   ZULIP_BOT_API_KEY - Bot API key
#   ZULIP_OPERATOR_EMAIL - Operator email for for mentions

services:
  watchdog:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: swain-helm-watchdog
    read_only: true
    # SYS_ADMIN needed for entrypoint.sh to mount tmpfs over parent
    # directories, hiding sibling directories from the container.
    cap_add:
      - SYS_ADMIN
    tmpfs:
      - /tmp
      - /run
      - /root/.local
      - /root/.cache
      - /root/.config/opencode
    ports:
      - "4098:4098"
    # The project-path volume is writable on the host. The root filesystem
    # is read-only (read_only: true), so writes outside tmpfs/volume mount
    # points fail with EROFS. The entrypoint shadows parent directories with
    # tmpfs so sibling directories are not even readable, then remounts the
    # project as read-write so git worktree operations work.
    volumes:
      # Read-only source used by entrypoint to recreate the project mount
      # after shadowing parents with tmpfs.
      - ${PROJECT_PATH:?PROJECT_PATH must be set}:/project_source:ro
      # Writable project mount at the real host path (needed for git).
      - ${PROJECT_PATH:?PROJECT_PATH must be set}:${PROJECT_PATH}
      - swain-test-config:/root/.config/swain-helm
      - opencode-data:/root/.opencode
    environment:
      - SWAIN_HELM_TEST_MODE=0
      - ZULIP_BOT_EMAIL=${ZULIP_BOT_EMAIL:?ZULIP_BOT_EMAIL required}
      - ZULIP_BOT_API_KEY=${ZULIP_BOT_API_KEY:?ZULIP_BOT_API_KEY required}
      - ZULIP_SITE=${ZULIP_SITE:-https://cristoslc.zulipchat.com}
      - ZULIP_OPERATOR_EMAIL=${ZULIP_OPERATOR_EMAIL:?ZULIP_OPERATOR_EMAIL required}
      - PROJECT_NAME=${PROJECT_NAME:?PROJECT_NAME required}
      - PROJECT_PATH=${PROJECT_PATH:?PROJECT_PATH must be set}
    working_dir: ${PROJECT_PATH}
    entrypoint: ["/entrypoint.sh", "python", "-m", "swain_helm.watchdog"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.config/swain-helm/run/watchdog.pid"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  swain-test-config:
    external: true
  opencode-data: